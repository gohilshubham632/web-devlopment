<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pattern</title>
</head>

<body>
    <table border="4" align="center" cellpadding="3"  cellspacing="10">
        <tr>
            <td>
    <form action="success.html" method="post">
        <label for="pan">pancard number:</label>
        <input type="text" id="pan" name="pan" placeholder="xxxxx9999x" required
            pattern="[a-zA-Z]{5}[0-9]{4}[a-zA-Z]{1}">
            <hr>
        <label for="aadhar">Aadhar card number:</label>
        <input type="text" id="aadhar" name="aadhar" placeholder="Enter 12 number" required
            pattern="[0-9]{12}">
            <hr>
        <label for="credit">Credit card number:</label>
        <input type="text" id="credit" name="credit" required placeholder="enter creditcard number" pattern="[0-9]{4}-[0-9]{4}-[0-9]{4}">
        <br><br>
        <label for="cvv">cvv number:</label>
        <input type="text" id="cvv" name="cvv" required placeholder="enter your cvv" pattern="[0-9]{3}">
        <br><br>
        <label for="expiry">expiry date:</label>
        <input type="date" id="expiry" name="expiry" required>
        <hr>
        <input type="submit" value="submit" align="center">
        </td>
        </tr>
        </table>
    </form>
</body>

</html>
