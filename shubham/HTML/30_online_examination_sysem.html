<html>

<head>
    <title>Online examintion</title>
</head>

<body>
    <h1 align="center">Online Examination</h1>

    <form>
        <h2>Student informtion</h2>
        <label>Name:</label>
        <input type="text" required>
        <br><br>
        <label>Roll number:</label>
        <input type="number" required>
        <br><br>
        <label>Email:</label>
        <input type="email" required>
        <br><br>
        <h2>Question-1</h2>
        <p>Which language is used to create the structure of web page.</p>
        <input type="radio" name="q1">html
        <br>
        <input type="radio" name="q1">css
        <br>
        <input type="radio" name="q1">python
        <br>
        <input type="radio" name="q1">php
        <br>
        <h2>Question-2</h2>
        <p>Which tags are used to create a table?</p>
        <input type="checkbox">table
        <br>
        <input type="checkbox">tr
        <br>
        <input type="checkbox">td
        <br>
        <input type="checkbox">img
        <br>
        <h2>Question-3</h2>
        <p>Choose your experience level.</p>
        <select>
            <option>Begginer</option>
            <option>intermidiate</option>
            <option>Advanced</option>
        </select>
        <h2>Question-4</h2>
        <p>Write your answer:</p>
        <textarea rows="7" cols="60"></textarea>
        <br><br>
        <input type="submit" value="submit exam">
        <input type="reset" value="clear all">
    </form>
</body>

</html>
