<html>
    <head>
        <title>
            hotel booking systems
        </title>
    </head>
    <body>
        <h1 align="center">Royal Palace Hotel</h1>
        <hr>
        <h2>Rooms information</h2>
        <table border="1" cellpadding="10" cellspacing="5">
            <tr>
                <th>Room Type</th>
                <th>Capacity</th>
                <th>Price/night</th>
                <th>Facilities</th>
            </tr>
            <tr>
                <td>Standard</td>
                <td>2 persons</td>
                <td>2500</td>
                <td>Wifi,tv</td>
            </tr>
            <tr>
                <td>Suite</td>
                <td>5 persons</td>
                <td>7500</td>
                <td>Wifi,tv,ac,breakfast</td>
            </tr>
        </table>
        <hr>
        <h2>Book your room</h2>
        <form>
            <h2>Guest details</h2>
            <label>Full name:</label>
            <input type="text" required>
            <br><br>
            <label>Email:</label>
            <input type="email" required>
            <br><br>
            <label>Mobile No:</label>
            <input type="tel" required>
            <br><br>
            <label>Check-in:</label>
            <input type="date" required>
            <br><br>
            <label>check-out:</label>
            <input type="date" required>
            <br><br>
            <label>Adults:</label>
            <input type="number" min="1" max="5">
            <br><br>
            <label>Children:</label>
            <input type="Number" min="0" max="3" requireds>
            <h2>Room Selection</h2>
            <select>
                <option>Select Room</option>
                <option>Standard</option>
                <option>Delux</option>
                <option>Suite</option>
            </select>
            <hr>
            <h2>Additional Services</h2>
            <input type="checkbox">Breakfast <br>
            <input type="checkbox">Airport Pickup<br>
            <input type="checkbox">Laundry <br>
            <input type="checkbox">Extra-Bed
            <br><br>
            <input type="submit" value="book now">
            <input type="reset" value="clear all">

        </form>
    </body>
</html
