<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: white;
        }
        nav{
            background-color: black;
            padding: 20px;
            text-align: center;
        }
        nav a{
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 15px;
        }
        nav a:hover{
            color:yellowgreen;
        }
        .home{
            text-align: center;
            background-color: lightblue;
            padding: 60px;
        }
        .home h1{
            font-size:40px;
             color:#333;
        }
        .home p{
            font-size:18px;
        }
        .home button{
            padding:12px 25px;
            background-color:#333;
            color: white;
            border:none;
            cursor: pointer;
            }
        .home button:hover{
            background-color:purple;
        }
        .container{
            display: flex;
            justify-content: center;
            gap:20px;
            padding: 40px;
        }
        .card{
            background-color:white;
            padding:25px;
            width: 200px;
            text-align: center;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }
        .card:hover{
            background-color:lightyellow;
        }
         footer{
            background-color:#333;
            padding:15px;
            text-align: center;
            color:white;
         }
    </style>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
    <div class="home">
        <h1>Welcome to my website!</h1>
        <p>learn,explore ane create something amazing</p>
        <button>get started</button>
    </div>
    <div class="container">
        <div class="card">
            <h2>HTML</h2>
            <P>Create the structure of a website.</P>
        </div>
        <div class="card">
            <h2>CSS</h2>
            <P>Make your website beautiful</P>
        </div>
        <div class="card">
            <h2>javascript</h2>
            <P>Add functionality to your website.</P>
        </div>
    </div>
    <footer>
        <p>&#xa9;my website | All Rights Reserved.</p>
    </footer>
</body>
</html>
